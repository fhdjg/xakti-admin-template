<!doctype html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar Akun — Xakti Admin</title>

  <script>
    (function () {
      try {
        var d = document.documentElement;
        var t = localStorage.getItem('xa:theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        d.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        var acc = localStorage.getItem('xa:accent');
        if (acc) d.setAttribute('data-xa-accent', acc);
        var rad = localStorage.getItem('xa:radius');
        if (rad) d.setAttribute('data-xa-radius', rad);
      } catch (e) {}
    })();
  </script>

  <link rel="preload" href="../../assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/css/app.min.css">
</head>
<body class="bg-body-tertiary d-flex align-items-center justify-content-center min-vh-100 p-3 position-relative">
  <div class="position-absolute top-0 end-0 p-3">
    <button class="btn btn-ghost btn-icon" type="button" data-xa-theme-toggle aria-label="Ganti Tema">
      <svg class="xa-icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#sun"/></svg>
    </button>
  </div>

  <div class="w-100" style="max-width: 26rem;">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center p-2 rounded bg-primary text-primary-foreground mb-2">
        <svg class="xa-icon xa-icon--lg" aria-hidden="true"><use href="../../assets/icons/sprite.svg#sparkles"/></svg>
      </div>
      <h1 class="h4 fw-bold mb-1">Buat Akun Baru</h1>
      <p class="text-muted small">Mulai kelola operasional dashboard Anda bersama Xakti</p>
    </div>

    <div class="card shadow-sm border">
      <div class="card-body p-4">
        <form onsubmit="event.preventDefault(); window.location.href='login.html';">
          <div class="mb-3">
            <label for="regName" class="form-label">Nama Lengkap</label>
            <input type="text" class="form-control" id="regName" required placeholder="Contoh: Budi Santoso">
          </div>

          <div class="mb-3">
            <label for="regEmail" class="form-label">Alamat Email</label>
            <input type="email" class="form-control" id="regEmail" required placeholder="nama@perusahaan.com">
          </div>

          <div class="mb-3">
            <label for="regPassword" class="form-label">Kata Sandi</label>
            <input type="password" class="form-control" id="regPassword" required placeholder="Minimal 8 karakter">
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="termsCheck" required>
            <label class="form-check-label small" for="termsCheck">
              Saya menyetujui <a href="#" class="text-decoration-none">Syarat & Ketentuan</a> serta Kebijakan Privasi.
            </label>
          </div>

          <button type="submit" class="btn btn-primary w-100 mb-3">
            Daftar Sekarang
          </button>

          <div class="text-center text-muted small">
            Sudah memiliki akun? <a href="login.html" class="fw-semibold text-decoration-none">Masuk di sini</a>
          </div>
        </form>
      </div>
    </div>

    <div class="text-center mt-4">
      <a href="../../index.html" class="text-muted small text-decoration-none d-inline-flex align-items-center gap-1">
        <svg class="xa-icon xa-icon--sm" aria-hidden="true"><use href="../../assets/icons/sprite.svg#chevron-left"/></svg>
        Kembali ke Beranda
      </a>
    </div>
  </div>

  <script src="../../assets/vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
  <script src="../../assets/js/app.bundle.js" defer></script>
</body>
</html>
