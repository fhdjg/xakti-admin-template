<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Modern admin dashboard template built on Bootstrap with a clean, minimalist shadcn ui design.
Pure HTML, CSS, and js without runtime framework dependencies (React, Vue, jQuery, Tailwind)">
  <meta name="keywords" content="admin template, free bootstrap admin template, bootstrap with shadcn ui">
  <meta name="author" content="fhdjg">
  <title>Sign in to Your Account — Xakti Admin</title>

  <script>
    (function () {
      try {
        var d = document.documentElement;
        var t = localStorage.getItem('xa:theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        d.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        var acc = localStorage.getItem('xa:accent');
        if (acc) d.setAttribute('data-xa-accent', acc);
        var rad = localStorage.getItem('xa:radius');
        if (rad) d.setAttribute('data-xa-radius', rad);
      } catch (e) {}
    })();
  </script>

  <link rel="preload" href="../../assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/css/app.min.css">
</head>
<body class="bg-body-tertiary d-flex align-items-center justify-content-center min-vh-100 p-3 position-relative">
  <!-- Theme toggle at top-right -->
  <div class="position-absolute top-0 end-0 p-3">
    <button class="btn btn-ghost btn-icon" type="button" data-xa-theme-toggle aria-label="Toggle Theme">
      <svg class="xa-icon" aria-hidden="true"><use href="../../assets/icons/sprite.svg#sun"/></svg>
    </button>
  </div>

  <div class="w-100" style="max-width: 24rem;">
    <!-- Brand Header -->
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center p-2 rounded bg-primary text-primary-foreground mb-2">
        <svg class="xa-icon xa-icon--lg" aria-hidden="true"><use href="../../assets/icons/sprite.svg#sparkles"/></svg>
      </div>
      <h1 class="h4 fw-bold mb-1">Welcome Back</h1>
      <p class="text-muted small">Enter your credentials to access the dashboard</p>
    </div>

    <!-- Login Card -->
    <div class="card shadow-sm border">
      <div class="card-body p-4">
        <form onsubmit="event.preventDefault(); window.location.href='../../index.html';">
          <div class="mb-3">
            <label for="loginEmail" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="loginEmail" required placeholder="admin@example.com" value="admin@example.com">
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label for="loginPassword" class="form-label mb-0">Password</label>
              <a href="forgot-password.html" class="small text-muted text-decoration-none">Forgot password?</a>
            </div>
            <input type="password" class="form-control" id="loginPassword" required placeholder="••••••••" value="password123">
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="rememberMe" checked>
            <label class="form-check-label small" for="rememberMe">Remember me on this device</label>
          </div>

          <button type="submit" class="btn btn-primary w-100 mb-3">
            Sign in to Dashboard
          </button>

          <div class="text-center text-muted small">
            Don’t have an account? <a href="register.html" class="fw-semibold text-decoration-none">Sign up now</a>
          </div>
        </form>
      </div>
    </div>

    <div class="text-center mt-4">
      <a href="../../index.html" class="text-muted small text-decoration-none d-inline-flex align-items-center gap-1">
        <svg class="xa-icon xa-icon--sm" aria-hidden="true"><use href="../../assets/icons/sprite.svg#chevron-left"/></svg>
        Back to Home
      </a>
    </div>
  </div>

  <script src="../../assets/vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
  <script src="../../assets/js/app.bundle.js" defer></script>
</body>
</html>
